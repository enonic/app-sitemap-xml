plugins {
	id 'maven-publish'
	id 'jacoco'
	id 'com.enonic.defaults' version '2.1.7'
	id 'com.enonic.xp.app'
	id 'com.github.node-gradle.node' version '7.1.0'
}

dependencies {
	implementation xplibs.api.core
	implementation xplibs.api.script
	implementation xplibs.api.portal

	include xplibs.context
	include xplibs.content
	include xplibs.portal
	include xplibs.project

	include libs.lib.cache

	testImplementation platform(libs.junit.bom)
	testImplementation platform(libs.mockito.bom)
	testImplementation libs.junit.jupiter
	testRuntimeOnly libs.junit.platform.launcher
	testImplementation libs.mockito.core
	testImplementation libs.mockito.junit.jupiter
	testImplementation libs.assertj.core
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	reports {
		xml.required = true
	}
}

repositories {
	mavenLocal()
	mavenCentral()
	xp.enonicRepo('dev')
}

node {
	// Whether to download and install a specific Node.js version or not
	// If false, it will use the globally installed Node.js
	// If true, it will download node using above parameters
	// Note that npm is bundled with Node.js
	download = true

	// Version of node to download and install (only used if download is true)
	// It will be unpacked in the workDir
	version = '24.15.0'
}

processResources {
	exclude '**/*.js'
	exclude '**/*.ts'
}

tasks.withType(Copy).configureEach {
	includeEmptyDirs = false
}

tasks.register('npmBuild', NpmTask) {
	args = [
		'run',
		'build'
	]
	dependsOn npmInstall
	environment = [
		'FORCE_COLOR': 'true',
		'LOG_LEVEL_FROM_GRADLE': gradle.startParameter.logLevel.toString(),
		'NODE_ENV': project.hasProperty('dev') || project.hasProperty('development') ? 'development' : 'production'
	]
	inputs.dir 'src/main/resources'
	outputs.dir 'build/resources/main'
}

jar.dependsOn npmBuild
classes.dependsOn npmBuild

tasks.register('npmCheck', NpmTask) {
	dependsOn npmInstall
	args = [
		'run',
		'check'
	]
	environment = [
		'FORCE_COLOR': 'true',
	]
}

tasks.register('npmTest', NpmTask) {
	args = [
		'run',
		'test'
	]
	dependsOn npmInstall
	environment = [
		'FORCE_COLOR': 'true',
	]
}

// If you ALWAYS want to SKIP `test` and `check` tasks on development build, wrap this inside an 'if...'
// if (!(project.hasProperty('dev') || project.hasProperty('development'))) {
check.dependsOn npmCheck
test.dependsOn npmTest
// }
