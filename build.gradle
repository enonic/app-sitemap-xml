plugins {
	id 'maven-publish'
	id 'jacoco'
	id 'com.enonic.defaults' version '2.1.5'
	id 'com.enonic.xp.app' version '3.5.0'
	id 'com.github.node-gradle.node' version '7.0.2'
}

app {
	name = project.appName
	displayName = 'Sitemap XML'
	vendorName = 'Enonic AS'
	vendorUrl = 'https://enonic.com'
	systemVersion = "${xpVersion}"
}

dependencies {
	compileOnly "com.enonic.xp:core-api:${xpVersion}"
	compileOnly "com.enonic.xp:script-api:${xpVersion}"
	// Provided by XP: the version XP 7.14 ships with
	compileOnly 'com.fasterxml.jackson.core:jackson-core:2.16.1'
	compileOnly 'com.fasterxml.jackson.core:jackson-databind:2.16.1'

	include "com.enonic.xp:lib-context:${xpVersion}"
	include "com.enonic.xp:lib-content:${xpVersion}"
	include "com.enonic.xp:lib-portal:${xpVersion}"
	include "com.enonic.xp:lib-project:${xpVersion}"

	testImplementation "com.enonic.xp:core-api:${xpVersion}"
	testImplementation "com.enonic.xp:script-api:${xpVersion}"
	testImplementation 'com.fasterxml.jackson.core:jackson-core:2.16.1'
	testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'
	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation platform('org.mockito:mockito-bom:5.20.0')
	testImplementation 'org.mockito:mockito-core'
	testImplementation 'org.mockito:mockito-junit-jupiter'
	testImplementation 'org.assertj:assertj-core:3.27.7'
}

tasks.withType(JavaCompile).configureEach {
	options.release = 11
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	reports {
		xml.required = true
	}
}

repositories {
	mavenLocal()
	mavenCentral()
	xp.enonicRepo()
}

node {
	// Whether to download and install a specific Node.js version or not
	// If false, it will use the globally installed Node.js
	// If true, it will download node using above parameters
	// Note that npm is bundled with Node.js
	download = true

	// Version of node to download and install (only used if download is true)
	// It will be unpacked in the workDir
	version = '20.11.0'
}

processResources {
	exclude '**/*.js'
	exclude '**/*.ts'
}

tasks.withType(Copy).configureEach {
	includeEmptyDirs = false
}

tasks.register('npmBuild', NpmTask) {
	args = [
		'run',
		'build'
	]
	dependsOn npmInstall
	environment = [
		'FORCE_COLOR': 'true',
		'LOG_LEVEL_FROM_GRADLE': gradle.startParameter.logLevel.toString(),
		'NODE_ENV': project.hasProperty('dev') || project.hasProperty('development') ? 'development' : 'production'
	]
	inputs.dir 'src/main/resources'
	outputs.dir 'build/resources/main'
}

jar.dependsOn npmBuild
classes.dependsOn npmBuild

tasks.register('npmCheck', NpmTask) {
	dependsOn npmInstall
	args = [
		'run',
		'check'
	]
	environment = [
		'FORCE_COLOR': 'true',
	]
}

tasks.register('npmTest', NpmTask) {
	args = [
		'run',
		'test'
	]
	dependsOn npmInstall
	environment = [
		'FORCE_COLOR': 'true',
	]
}

// If you ALWAYS want to SKIP `test` and `check` tasks on development build, wrap this inside an 'if...'
// if (!(project.hasProperty('dev') || project.hasProperty('development'))) {
check.dependsOn npmCheck
test.dependsOn npmTest
// }
