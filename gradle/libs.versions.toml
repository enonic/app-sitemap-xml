[versions]
junit = "6.1.3"
mockito = "5.24.0"

[libraries]
# Provided by XP: the version XP 8.1.1 ships with
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version = "2.22.4" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version = "2.22.4" }

junit-bom                = { module = "org.junit:junit-bom",                        version.ref = "junit" }
junit-jupiter            = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher  = { module = "org.junit.platform:junit-platform-launcher" }
mockito-bom              = { module = "org.mockito:mockito-bom",                    version.ref = "mockito" }
mockito-core             = { module = "org.mockito:mockito-core" }
assertj-core             = { module = "org.assertj:assertj-core",                   version = "3.27.7" }
mockito-junit-jupiter    = { module = "org.mockito:mockito-junit-jupiter" }
